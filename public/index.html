<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="대전 학생과 학부모가 입시 정보와 고민을 나누는 곳">
  <meta property="og:type" content="website">
  <meta property="og:title" content="태산입시">
  <meta property="og:description" content="대전 학생과 학부모가 입시 정보와 고민을 나누는 곳">
  <meta property="og:url" content="https://taesan.uinone.net/">
  <title>태산입시</title>
  <link rel="icon" href="images/logo.png">
  <link rel="preload" href="fonts/wanted-sans/wanted-sans.css" as="style">
  <link rel="stylesheet" href="fonts/wanted-sans/wanted-sans.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topline hidden" id="topline"><div class="topline-in">
    <button type="button" data-tl="-1" aria-label="이전 안내"><svg class="icon sm" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <a id="tl-text" href="#/"></a>
    <button type="button" data-tl="1" aria-label="다음 안내"><svg class="icon sm" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
  </div></div>

  <header class="gnb">
    <div class="gnb-in">
      <a href="#/" class="logo" aria-label="태산입시 홈"><img src="images/logo.webp" alt="태산학원"><span class="logo-name">입시 커뮤니티</span></a>
      <form class="gnb-search" id="gnb-search" role="search">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input name="q" placeholder="게시글 검색" aria-label="게시글 검색">
      </form>
      <nav class="gnb-nav" id="gnb-nav" aria-label="바로가기"></nav>
      <div class="gnb-m" id="gnb-m"></div>
    </div>
  </header>

  <section class="cover" id="cover">
    <div class="cover-in">
      <p class="cover-eyebrow">TAESAN ADMISSIONS</p>
      <h1 class="cover-title" id="cover-title">태산입시</h1>
      <p class="cover-sub" id="cover-sub">대전 학생과 학부모가 입시 정보와 고민을 나누는 곳</p>
    </div>
  </section>

  <nav class="lnb" aria-label="게시판"><div class="lnb-in" id="lnb"></div></nav>

  <div class="layout" id="layout">
    <aside class="side" id="side" aria-label="커뮤니티 메뉴"></aside>
    <main id="view" aria-live="polite"><div class="loading">불러오는 중</div></main>
  </div>

  <footer class="footer">
    <div class="footer-in">
      <div>
        <img src="images/logo.webp" alt="태산학원">
        <p>태산입시 · 운영 태산학원</p>
        <p>대전광역시 서구 둔산남로 96 E.플러스빌딩 2층 · 042-321-5788</p>
      </div>
      <div class="footer-links">
        <a href="#/rules">이용규칙</a><a href="#/data-rules">자료실 규칙</a><a href="#/privacy"><b>개인정보 처리방침</b></a>
      </div>
    </div>
  </footer>

  <button class="to-top" id="to-top" aria-label="맨 위로"><svg class="icon" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg></button>
  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
