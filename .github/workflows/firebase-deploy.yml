# main 브랜치에 올리면 Firebase Hosting·보안 규칙을 자동 배포합니다.
# 필요한 저장소 Secret: FIREBASE_SERVICE_ACCOUNT (서비스 계정 JSON 전체), 변수: FIREBASE_PROJECT_ID
name: Deploy to Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Deploy hosting and rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@13 deploy --only hosting,firestore,storage --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
